product:
  max_cameras: 3
cameras:
- id: cam1
  name: Piscina Principal
  source: /dev/video2
  roi_file: roi_cam1.yaml
video:
  display: true
  resize_width: 640      # frame de trabalho menor = menos decode/encode no Pi
  backend: auto
  infer_every: 2         # roda YOLO a cada 2 frames (o dwell suaviza)
  stream_fps: 12         # teto de FPS do preview web (poupa CPU encodando JPEG)
motion:
  enabled: true          # porteiro: só aciona o YOLO quando algo mexe na ROI
  diff_thresh: 18        # sensibilidade do diff (maior = ignora ruído/ondulação)
  min_motion_frac: 0.004 # fração mínima de pixels mudados p/ considerar movimento
  person_hold_seconds: 4.0    # após ver alguém, segue checando mesmo parado
  motion_hold_seconds: 1.5    # mantém YOLO ligado logo após um movimento
  heartbeat_seconds: 2.0      # mesmo ocioso, força 1 checagem a cada 2s (segurança)
classify:
  enabled: true
  child_height_frac: 0.45
  alert_child_alone: true
  alert_child_with_adult_outside_hours: true
  allowed_hours:
  - start: 08:00
    end: '18:00'
model:
  weights: yolov8n_ncnn_model   # NCNN: ~2-3x mais rápido e menos RAM no Pi (gere com 'make export')
  conf: 0.5
  iou: 0.45
  device: cpu
  imgsz: 320                     # resolução de inferência: 320 detecta bem e é ~4x mais leve que 640
roi:
  file: roi_pool.yaml
alarm:
  enabled_start: true
  dwell_seconds: 1.5            # tempo na ROI p/ disparar (casos não-críticos)
  dwell_child_alone_seconds: 0.5  # CRÍTICO: criança sozinha dispara quase na hora
  dwell_grace_seconds: 0.6     # tolera falhas breves de detecção sem zerar o dwell
  min_box_area: 7000
  cooldown_seconds: 2
outputs:
  gpio:
    enabled: true
    pin: 17
    setup: BCM
    active_high: true
    mode: sustained        # sirene segue o alarme: ligada enquanto a criança está na ROI, desliga ao sair
    pulse_ms: 500
    clear_pin: 27
    clear_active_high: true
    clear_pull: PUD_DOWN
    clear_debounce_ms: 120
web:
  username: admin
  password: poolguard
  host: 0.0.0.0
  port: 8000
notify:
  title: PoolGuard — ALERTA
  message: Pessoa detectada na area da piscina!
  snapshot: true
  channels:
    ntfy:
      enabled: true
      server: https://ntfy.sh
      topic: poolguard-troque-este-topico-secreto
      priority: null
    telegram:
      enabled: false
    mqtt:
      enabled: false
      host: localhost
      port: 1883
      topic: poolguard/alert
    pushover:
      enabled: false
      priority: 1
    gotify:
      enabled: false
      server: http://localhost:8080
      priority: 8
